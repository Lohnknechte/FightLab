name: "Godot Build Pipeline"

on:
  push:
    branches: [ "main", "5-operations-quality-gate" ]
  pull_request:
    branches: [ "main", "5-operations-quality-gate" ]

permissions:
  contents: write

jobs:
  export_game:
    name: Godot Export
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            binary_name: game.exe
          - platform: Linux
            binary_name: game.x86_64
          - platform: Web
            binary_name: index.html
          - platform: Android
            binary_name: game.apk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java & Android SDK (Android Only)
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools (Android Only)
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Debug Keystore (Android Only)
        if: matrix.platform == 'Android'
        run: |
          mkdir -p android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 365

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          download-templates: true

      - name: Create Export Directories
        run: mkdir -v -p build/${{ matrix.platform }}

      - name: Pre-import Godot Assets
        run: godot --headless --editor --quit

      - name: Compile and Export
        run: |
          godot --headless --export-release "${{ matrix.platform }}" "build/${{ matrix.platform }}/${{ matrix.binary_name }}"
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: build/${{ matrix.platform }}/

  publish_release:
    name: Publish Builds to GitHub Release
    needs: export_game
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts For Distribution
        run: |
          mkdir staging
          cd artifacts
          for dir in */; do
            # Keep APK separate instead of zipping it, making it easier to install directly on mobile devices
            if [ "$dir" = "Android-build/" ]; then
              cp Android-build/*.apk ../staging/
            else
              zip -r "../staging/${dir%/}.zip" "$dir"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          draft: false
          prerelease: false
          files: staging/*