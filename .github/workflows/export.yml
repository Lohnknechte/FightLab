name: "Godot 4.7 Build and Export Pipeline"

env:
  GODOT_VERSION: "4.7.0"

on:
  push:
    branches: [ "main", "5-operations-quality-gate" ]
  pull_request:
    branches: [ "main", "5-operations-quality-gate" ]

permissions:
  contents: write

jobs:
  export_game:
    name: Godot Export
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "Windows Desktop"
            folder_name: Windows
            binary_name: game.exe
          - platform: "Linux"
            folder_name: Linux
            binary_name: game.x86_64
          - platform: "Web"
            folder_name: Web
            binary_name: index.html

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create Export Directories
        run: mkdir -v -p build/${{ matrix.folder_name }}

      - name: Pre-import Godot Assets
        run: godot --headless --import --quit

      - name: Compile and Export
        run: |
          godot --headless --export-release "${{ matrix.platform }}" "build/${{ matrix.folder_name }}/${{ matrix.binary_name }}"
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder_name }}-build
          path: build/${{ matrix.folder_name }}/

  publish_release:
    name: Publish Builds to GitHub Release
    needs: export_game
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts For Distribution
        run: |
          mkdir staging
          cd artifacts
          for dir in */; do
            cd "$dir"
            zip -r "../../staging/${dir%/}.zip" .
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release Build v${{ github.run_number }}
          draft: false
          prerelease: false
          files: staging/*